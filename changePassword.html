<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Lupa Password</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="changePass.css">
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE -->
        <div class="left-side">

            <img src="img/changePass.png" alt="Change Password">

            <div class="overlay"></div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="right-side">

            <div class="login-card">

                <!-- LOGO -->
                <div class="logo">
                    <img src="img/logo.png" alt="Logo">
                </div>

                <!-- TITLE -->
                <h2 class="logo-text">
                    <span class="bold">Donasi</span><span class="regular">ku</span>
                </h2>

                <!-- WELCOME -->
                <div class="welcome">
                    <h1>Ganti Password</h1>
                </div>

                <!-- FORM -->
                <form id="changeForm">

                    <!-- EMAIL -->
                    <div class="form-group">

                        <label>Password Baru</label>

                        <div class="input-box">

                            <input type="password" id="newPassword" placeholder="Masukkan password baru">

                            <span class="toggle-password" id="toggleNew">
                                <i class="fa-regular fa-eye-slash"></i>
                            </span>
                        </div>

                    </div>

                    <!-- OTP -->
                    <div class="form-group">

                        <div class="otp-header">

                            <label>Konfirmasi Password</label>

                        </div>

                        <div class="input-box">

                            <input type="password" id="confirmedPassword" placeholder="Konfirmasi Password baru">

                            <span class="toggle-password" id="toggleConfirmed">
                                <i class="fa-regular fa-eye-slash"></i>
                            </span>

                        </div>

                        <!-- BUTTON -->
                        <button type="submit" id="btnReset" class="btn-reset">
                            Reset Password
                        </button>

                        <!-- SIGNUP -->
                        <div class="signup">

                            <span>Belum punya akun?</span>

                            <a href="registerPage.html">
                                Daftar sekarang
                            </a>

                        </div>

                </form>

            </div>

        </div>

    </div>

    <script src="changePass.js"></script>
</body>

</html>
